<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hospital ERP Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Comprehensive documentation for the Hospital ERP System">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Modern Font: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Theme: Vue -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <style>
    :root {
      /* Vibrant Primary Colors */
      --theme-color: #3b82f6;
      --sidebar-nav-link-color--active: #2563eb;
      --sidebar-nav-pagelink-background: rgba(59, 130, 246, 0.1);
      --base-font-family: 'Outfit', sans-serif;
      --heading-color: #1e293b;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #f8fafc;
      scroll-behavior: smooth;
    }

    /* Beautiful Sidebar Styling */
    .sidebar {
      background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
      border-right: 1px solid #e2e8f0;
      box-shadow: 4px 0 15px rgba(0,0,0,0.03);
    }
    
    .sidebar h1.app-name {
      font-weight: 700;
      font-size: 24px;
      background: linear-gradient(90deg, #2563eb, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-top: 20px;
    }

    /* Content Styling & Animation */
    .markdown-section {
      max-width: 900px;
      animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(20px);
    }

    @keyframes slideUpFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .markdown-section h1, 
    .markdown-section h2, 
    .markdown-section h3 {
      font-weight: 700;
      color: #0f172a;
      position: relative;
    }

    .markdown-section h1::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 0;
      width: 60px;
      height: 4px;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      border-radius: 4px;
    }

    /* Image Styling */
    .markdown-section img {
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      margin: 20px 0;
      border: 1px solid #e2e8f0;
    }

    .markdown-section img:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(59, 130, 246, 0.15);
    }

    /* Custom Blockquotes */
    .markdown-section blockquote {
      border-left: 4px solid #3b82f6;
      background: rgba(59, 130, 246, 0.05);
      border-radius: 0 8px 8px 0;
      padding: 16px 20px;
      color: #334155;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div id="app">Loading brilliant documentation...</div>
  <script>
    window.$docsify = {
      name: '🏥 Hospital ERP',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: '🔍 Type to search',
        noData: 'No Results Found!',
        depth: 6,
        hideOtherSidebarContent: false,
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!'
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Copy to Clipboard Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/index.min.js"></script>
</body>
</html>
