<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hospital ERP</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Inter', sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0d2847 50%, #0a3d6b 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #e2e8f0;
    }
    .loader {
      text-align: center;
      max-width: 420px;
      padding: 2rem;
    }
    .logo-box {
      width: 88px;
      height: 88px;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
      animation: pulse 2s ease-in-out infinite;
    }
    .logo-box svg {
      width: 42px;
      height: 42px;
      fill: #00b4a0;
    }
    h1 {
      font-size: 24px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #00b4a0;
      margin-bottom: 28px;
    }
    p.status {
      font-size: 14px;
      color: #94a3b8;
      margin-bottom: 24px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: #00b4a0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    .error-box {
      display: none;
      margin-top: 28px;
      padding: 20px 24px;
      background: rgba(220,38,38,0.1);
      border: 1px solid rgba(220,38,38,0.3);
      border-radius: 14px;
      color: #fca5a5;
      font-size: 13px;
      line-height: 1.6;
      text-align: left;
    }
    .error-box .error-title {
      font-weight: 600;
      color: #f87171;
      margin-bottom: 8px;
      font-size: 14px;
    }
    .error-box .error-detail {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      color: #fda4af;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      max-height: 120px;
      overflow-y: auto;
      word-break: break-all;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 16px;
    }
    .btn {
      padding: 9px 22px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      border: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #00b4a0;
      color: #fff;
    }
    .btn-primary:hover { background: #00a090; }
    .btn-ghost {
      background: rgba(255,255,255,0.08);
      color: #e2e8f0;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.15); }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  </style>
</head>
<body>
  <div class="loader">
    <div class="logo-box">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-1 11h-4v4h-4v-4H6v-4h4V6h4v4h4v4z"/></svg>
    </div>
    <h1>Shree Kamal Hospital</h1>
    <div class="subtitle">Hospital Management System</div>
    <p class="status" id="statusText">Connecting to server...</p>
    <div class="spinner" id="spinner"></div>
    <div class="error-box" id="errorBox">
      <div class="error-title">⚠ Connection Issue</div>
      <div id="errorText">Unable to connect to the server.</div>
      <div class="error-detail" id="errorDetail"></div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="attemptConnect()">Retry</button>
        <button class="btn btn-ghost" onclick="openInBrowser()">Open in Browser</button>
      </div>
    </div>
  </div>

  <script>
    const SERVER_URL = "https://main.d1q3k1sxasl1mr.amplifyapp.com/login";
    let attempts = 0;
    const MAX_ATTEMPTS = 3;

    function updateStatus(msg) {
      document.getElementById('statusText').textContent = msg;
    }

    function showError(msg, detail) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('statusText').style.display = 'none';
      const errorBox = document.getElementById('errorBox');
      errorBox.style.display = 'block';
      if (msg) document.getElementById('errorText').textContent = msg;
      if (detail) document.getElementById('errorDetail').textContent = detail;
    }

    function openInBrowser() {
      // Try Tauri shell API to open in system browser
      if (window.__TAURI__) {
        try {
          window.__TAURI__.shell.open(SERVER_URL);
        } catch(e) {
          window.open(SERVER_URL, '_blank');
        }
      } else {
        window.open(SERVER_URL, '_blank');
      }
    }

    async function attemptConnect() {
      attempts++;
      document.getElementById('errorBox').style.display = 'none';
      document.getElementById('spinner').style.display = 'block';
      document.getElementById('statusText').style.display = 'block';
      updateStatus('Connecting to server (attempt ' + attempts + ')...');

      try {
        // First, check if the server is reachable
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 8000);

        const response = await fetch(SERVER_URL, {
          method: 'HEAD',
          mode: 'no-cors',
          signal: controller.signal,
          cache: 'no-store'
        });
        clearTimeout(timeout);

        // Server is reachable — navigate
        updateStatus('Server connected. Loading application...');
        setTimeout(() => {
          window.location.replace(SERVER_URL);
        }, 300);

      } catch (err) {
        if (attempts < MAX_ATTEMPTS) {
          updateStatus('Retrying in 2 seconds...');
          setTimeout(attemptConnect, 2000);
        } else {
          showError(
            'Unable to reach the Hospital ERP server after ' + MAX_ATTEMPTS + ' attempts.',
            'URL: ' + SERVER_URL + '\nError: ' + (err.message || err)
          );
        }
      }
    }

    // Catch any unhandled errors globally
    window.onerror = function(msg, url, line, col, error) {
      showError(
        'A client-side error occurred.',
        'Message: ' + msg + '\nURL: ' + url + '\nLine: ' + line + '\nDetails: ' + (error ? error.stack : 'N/A')
      );
      return true;
    };

    // Start connection attempt
    attemptConnect();
  </script>
</body>
</html>
