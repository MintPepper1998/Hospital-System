<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shree Kamal Hospital</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #e8ecf1, #d4d9e0);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
    }

    .logo-wrapper {
      width: 120px;
      height: 120px;
      border-radius: 30px;
      background: linear-gradient(145deg, #eef2f7, #d6dbe2);
      box-shadow:
        8px 8px 20px rgba(163, 170, 182, 0.5),
        -8px -8px 20px rgba(255, 255, 255, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: breathe 2.5s ease-in-out infinite;
    }

    .logo-wrapper img {
      width: 88px;
      height: 88px;
      border-radius: 18px;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .hospital-name {
      text-align: center;
    }

    .hospital-name h1 {
      font-size: 22px;
      font-weight: 700;
      color: #2d3748;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    .hospital-name p {
      font-size: 11px;
      font-weight: 600;
      color: #8a96a8;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .loader-track {
      width: 200px;
      height: 4px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.06);
      box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      margin-top: 4px;
    }

    .loader-fill {
      width: 40%;
      height: 100%;
      border-radius: 4px;
      background: linear-gradient(90deg, #1a56a8, #2e7ddb, #1a56a8);
      background-size: 200% 100%;
      animation: slide 1.5s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); background-position: 0% 0%; }
      50%  { background-position: 100% 0%; }
      100% { transform: translateX(250%); background-position: 0% 0%; }
    }

    .loading-text {
      font-size: 11px;
      font-weight: 500;
      color: #a0aab8;
      letter-spacing: 0.8px;
      margin-top: 10px;
      text-align: center;
    }

    .version {
      position: fixed;
      bottom: 16px;
      right: 20px;
      font-size: 10px;
      color: #b8c2cf;
      font-weight: 500;
    }
  </style>
</head>
